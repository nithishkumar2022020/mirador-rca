name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.24.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Format check
        run: make fmt-check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Coverage
        run: make test-cover
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      - name: Start Valkey
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8.0-alpine valkey-server --save "" --appendonly no
      - name: Start Weaviate
        run: |
          docker run -d --name weaviate -p 8080:8080 \
            -e QUERY_DEFAULTS_LIMIT=25 \
            -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            -e PERSISTENCE_DATA_PATH=/var/lib/weaviate \
            -e DEFAULT_VECTORIZER_MODULE=none \
            -e ENABLE_MODULES=none \
            -e CLUSTER_HOSTNAME=node1 \
            -e DISABLE_TELEMETRY=true \
            semitechnologies/weaviate:1.25.7
      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker exec valkey valkey-cli ping | grep -q PONG; do sleep 1; done'
          timeout 60 bash -c 'until curl -f http://localhost:8080/v1/meta; do sleep 1; done'
      - name: Integration tests
        run: make test-integration
      - name: Stop services
        if: always()
        run: |
          docker stop valkey weaviate || true
          docker rm valkey weaviate || true

  helm:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2
      - name: Lint chart
        run: make helm-lint
