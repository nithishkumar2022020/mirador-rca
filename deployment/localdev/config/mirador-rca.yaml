server:
  address: ":9092"
  metricsAddress: ":2112"
  gracefulTimeout: 10s

clients:
  core:
    baseURL: "http://127.0.0.1:8010"
    metricsPath: "/api/v1/rca/metrics"
    logsPath: "/api/v1/rca/logs"
    tracesPath: "/api/v1/rca/traces"
    serviceGraphPath: "/api/v1/rca/service-graph"
    timeout: 3s

weaviate:
  endpoint: "http://127.0.0.1:8080"
  apiKey: ""
  timeout: 5s

cache:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  dialTimeout: 2s
  readTimeout: 500ms
  writeTimeout: 500ms
  maxRetries: 2
  similarIncidentsTTL: 60s
  patternsTTL: 120s
  serviceGraphTTL: 120s
  tls: false

logging:
  level: debug
  json: false

rules:
  path: "configs/rules/default.yaml"

llm:
  enabled: true
  baseURL: "http://127.0.0.1:8000"
  timeout: 30s
